# 测试环境配置：使用独立测试库 mangban_test，隔离开发库 mangban / mangban_dev
#
# 该文件与主配置 application.yml 合并生效（test profile 激活时）：
# - 仅覆盖数据源，指向 mangban_test
# - sql.init.mode: always 继承主配置 → 每次测试启动用 schema.sql + data.sql
#   初始化测试库（两者均为幂等语句，重复执行安全）
# - jpa.ddl-auto: none 继承主配置 → 表结构由 schema.sql 控制
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mangban_test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 740130
    driver-class-name: com.mysql.cj.jdbc.Driver
